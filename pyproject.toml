[project]
name = "geo-mini-rag"
version = "0.1.0"
description = "A small RAG pipeline for cheap models, showing how E&P file formats can be read into it"
readme = "README.md"
authors = [
    { name = "Bryan Hughes", email = "bryan@purr.io" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "lasio>=0.32",
    "pyarrow>=25.0.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-calamine>=0.5.0",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "xlrd>=2.0.1",   # only for Excel 4.0 and earlier, which calamine cannot open
]

[project.scripts]
geo-mini-rag = "geo_mini_rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
