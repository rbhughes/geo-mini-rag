# Appraisal policy. The manifest id is a hash of this file plus the inventory,
# so changing policy produces a new, comparable manifest instead of a rebuild.
version: 1

inventory:
  magic_bytes: 2048            # bytes read per file for type detection
  junk_names: [".DS_Store", "Thumbs.db", "desktop.ini"]
  junk_prefixes: ["~$", "._"]

# E&P formats that are data, not documents. Excluded with a stated reason.
not_documents:
  extensions: [".sgy", ".segy", ".dlis", ".lis", ".dwg", ".dxf"]
  # Petra / GeoGraphix project folders. Left empty until the real on-disk
  # signatures are confirmed from actual projects or vendor documentation.
  project_dirs: []

# Multi-file formats: one primary file plus sidecars that are not documents on
# their own. Pass 0 records each sidecar's primary in `part_of`.
# Only the ESRI shapefile family is listed; vendor project bundles go here once
# their real sidecar extensions are confirmed.
bundles:
  exclude_sidecars: true   # a sidecar belongs to its primary; it is not a document
  formats:
    ".shp": [".shx", ".dbf", ".prj", ".sbn", ".sbx", ".cpg", ".qix", ".aih", ".ain", ".atx", ".shp.xml"]

# Structured text that wants its own summarizer, not a chunker
special_classes:
  las: [".las"]
  # The primary of a bundle: its handler reads the sidecars off disk, so the
  # .prj, .dbf and .shp.xml never stand alone as documents.
  shapefile: [".shp"]

dedupe:
  prefilter_bytes: 1048576     # hash size + first/last 1MB before a full sha256

