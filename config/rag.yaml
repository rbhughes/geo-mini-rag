# The pipeline's settings. One chat model, one embedding model: this project
# studies appraisal and ingest for E&P documents, not model selection.
# Changing the embedding model or the chunking requires `ingest --rebuild`.
embed:
  model: openai/text-embedding-3-small   # OpenRouter; `geo-mini-rag models --embeddings` lists the alternatives
  batch_size: 100                        # chunks per embeddings request
  concurrency: 6                         # requests in flight; batches are filled across documents

answer:
  model: inclusionai/ling-3.0-flash      # cheap, 262k context; `-m` overrides it for one question
  max_tokens: 800

# Chunks are built from document elements (paragraphs, table rows, pages), not
# by cutting raw text at fixed offsets: sequential elements are combined up to
# max_characters, and overlap applies only when one element is too big to fit.
chunk:
  max_characters: 1200
  overlap: 200
  respect_page_breaks: true   # never merge text from two pages into one chunk

extract:
  max_pdf_pages: 200          # longer PDFs are truncated, and the row says so
  max_text_bytes: 5000000     # plain text and HTML read cap
  # A PDF yielding less than this per page has no usable text layer, so it is
  # OCR'd and read again. Same idea as Unstructured's fast -> ocr_only fallback.
  ocr_below_chars_per_page: 50
  ocr_language: eng

# Per-handler settings. A handler reads its own block and falls back to its
# defaults, so adding a handler does not require touching this file.
handlers:
  shapefile:
    features_per_chunk: 25          # attribute rows described in one chunk, budget permitting
    max_features_read: 0            # 0: read every record, so a layer is never part-indexed
    categorical_max_ratio: 0.2      # each value recurs at least five times: a category, not a name
    dominant_max_share: 0.9         # a value this common describes the layer, not the feature
    prose_min_length: 40            # average characters, above which a field is text not a label
    max_fact_values: 200

# Facts that any document can carry, whatever its format. These run over the
# text partitioning produced, so a PDF report and a LAS header are read alike.
enrich:
  api_numbers:
    label_window: 60        # characters before the digits in which API or UWI must appear
    max_per_document: 0     # 0: keep every identifier a document names

retrieve:
  top_k: 6
  # Document metadata a handler extracted (well, api, field, operator...) is part
  # of ranking: when a question names a value that exists in the index, that
  # document's chunks get this added to their cosine score. Identifiers are what
  # embeddings are worst at, and 1,400 near-identical LAS headers rank alike
  # without it. `search --where key=value` filters instead of boosting.
  metadata_boost: 0.10           # full boost goes to a value only one document carries
  metadata_min_value_length: 4   # shorter values match too much to be evidence
  metadata_skip_keys: []         # rarity governs the weight, so every key can take part
